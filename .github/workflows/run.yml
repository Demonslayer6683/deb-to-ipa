name: Run

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Convert deb to IPA
        run: |
          # Download the IPA from MediaFire
          curl -L -o ${{ github.workspace }}/app.ipa "https://download1349.mediafire.com/gabcesp8wxtgOjBxF_sUZPDdW5QhN3gpo1-X9vd9rCZlLrRpUXpp8PMGOZXZwfFqG5mTorUn4yd92YzB8mUFuH3FTD-pS_GgL9F2jTcFM1dYDna-q-qfinkWAHZpMNI3xSBEAaYqTvLOhyGZbg4eYeP3DgJRoEbnnZhmgq1U4B4_GCE/qhq37lm2051p583/com.sp0n.vigilante_0.1281.1_und3fined.ipa"

          # Download the deb
          curl -L -o ${{ github.workspace }}/app.deb "https://github.com/vincedes3/CitizenPremium/releases/download/v1.1.0/com.vincedes3.citizen_1.1.0.deb"

          # Extract the deb
          dpkg-deb -X ${{ github.workspace }}/app.deb ${{ github.workspace }}/tweak

          # Unzip the IPA
          unzip ${{ github.workspace }}/app.ipa -d ${{ github.workspace }}/ipa_extracted

          # Find the .app bundle
          APP_PATH=$(find ${{ github.workspace }}/ipa_extracted/Payload -name "*.app" -maxdepth 1)

          # Copy the dylib into the app
          cp ${{ github.workspace }}/tweak/Library/MobileSubstrate/DynamicLibraries/CitizenPremium.dylib "$APP_PATH/"

          # Repack the IPA
          cd ${{ github.workspace }}/ipa_extracted
          zip -r ${{ github.workspace }}/App_modified.ipa .

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App
          path: ${{ github.workspace }}/App_modified.ipa
